name: Supabase migrations

on:
  push:
    branches: ["main"]
    paths:
      - "services/main-service/supabase/migrations/**"
      - ".github/workflows/supabase-migrate.yml"

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Link Supabase project
        working-directory: services/main-service
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Defina os secrets SUPABASE_ACCESS_TOKEN e SUPABASE_DB_PASSWORD no GitHub."
            exit 1
          fi
          supabase link --project-ref wnaymuusxwvawmbieukm --password "$SUPABASE_DB_PASSWORD"

      - name: Push pending migrations
        working-directory: services/main-service
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push

      - name: Migration list (log)
        working-directory: services/main-service
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase migration list
