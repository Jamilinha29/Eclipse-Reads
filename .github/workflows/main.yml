name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  # ================================
  root-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install backend deps for fault-tolerance tests
        run: npm run install:backends

      - name: Run root tests
        run: npm test

#FRONTEND TESTS
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Build frontend
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-anon-key
          VITE_BOOKS_API_URL: http://localhost:4000
          VITE_LIBRARY_API_URL: http://localhost:4200
        run: |
          cd frontend
          npm run build

#BACKEND TESTS
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [books-api, auth-proxy, library-service]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: |
          cd services/backend/${{ matrix.service }}
          npm run build

 #DOCKER BUILD AND PUSH
  build-and-push-docker-images:
    runs-on: ubuntu-latest
    needs: [frontend, backend, root-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Define Docker cache mode
        run: |
          if [ "${{ github.run_attempt }}" -gt 1 ]; then
            echo "DOCKER_NO_CACHE=--no-cache" >> $GITHUB_ENV
            echo "Re-run detected (attempt ${{ github.run_attempt }}): enabling --no-cache"
          else
            echo "DOCKER_NO_CACHE=" >> $GITHUB_ENV
            echo "First attempt: using Docker layer cache"
          fi

      - name: Build & Push Books API
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/books-api:latest"
          IMAGE_LOWER=$(echo $IMAGE | tr '[:upper:]' '[:lower:]')
          docker build $DOCKER_NO_CACHE -t $IMAGE_LOWER ./services/backend/books-api
          docker push $IMAGE_LOWER

      - name: Build & Push Auth Proxy
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/auth-proxy:latest"
          IMAGE_LOWER=$(echo $IMAGE | tr '[:upper:]' '[:lower:]')
          docker build $DOCKER_NO_CACHE -t $IMAGE_LOWER ./services/backend/auth-proxy
          docker push $IMAGE_LOWER

      - name: Build & Push Library Service
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/library-service:latest"
          IMAGE_LOWER=$(echo $IMAGE | tr '[:upper:]' '[:lower:]')
          docker build $DOCKER_NO_CACHE -t $IMAGE_LOWER ./services/backend/library-service
          docker push $IMAGE_LOWER

#DEPLOY FRONTEND
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [frontend, backend, root-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for production
        env:
          VITE_BOOKS_API_URL: ${{ secrets.VITE_BOOKS_API_URL }}
          VITE_LIBRARY_API_URL: ${{ secrets.VITE_LIBRARY_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: cd frontend && npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --name eclipse-reads
