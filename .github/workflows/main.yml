name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  # ================================
  root-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install backend deps for fault-tolerance tests
        run: npm run install:backends

      - name: Run root tests
        run: npm test

      - name: Test coverage (backends, D-10)
        run: npm run test:coverage

#FRONTEND TESTS
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint --workspace=frontend

      - name: TypeScript check (frontend)
        run: npx tsc -p frontend/tsconfig.app.json --noEmit

      - name: Build frontend
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-anon-key
          VITE_BOOKS_API_URL: http://localhost:4000
          VITE_LIBRARY_API_URL: http://localhost:4200
        run: npm run build --workspace=frontend

#BACKEND TESTS
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [books-api, auth-proxy, library-service]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: |
          cd services/backend/${{ matrix.service }}
          npm run build

#SUPABASE MIGRATIONS (before deploy)
  supabase-migrate:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: Check secrets
        id: secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "Secrets SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD ausentes — migração ignorada."
          fi

      - uses: dorny/paths-filter@v3
        id: changes
        if: steps.secrets.outputs.ready == 'true'
        with:
          filters: |
            migrations:
              - 'services/main-service/supabase/migrations/**'

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true' && steps.changes.outputs.migrations == 'true'
        with:
          version: 2.101.0

      - name: Link Supabase project
        if: steps.secrets.outputs.ready == 'true' && steps.changes.outputs.migrations == 'true'
        working-directory: services/main-service
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref wnaymuusxwvawmbieukm --password "$SUPABASE_DB_PASSWORD"

      - name: Push pending migrations
        if: steps.secrets.outputs.ready == 'true' && steps.changes.outputs.migrations == 'true'
        working-directory: services/main-service
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push

      - name: Migration list (log)
        if: steps.secrets.outputs.ready == 'true' && steps.changes.outputs.migrations == 'true'
        working-directory: services/main-service
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase migration list

#DOCKER BUILD AND PUSH
  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend, root-tests, supabase-migrate]
    if: |
      always() &&
      needs.frontend.result == 'success' &&
      needs.backend.result == 'success' &&
      needs.root-tests.result == 'success' &&
      (needs.supabase-migrate.result == 'success' || needs.supabase-migrate.result == 'skipped') &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Define Docker cache mode
        run: |
          if [ "${{ github.run_attempt }}" -gt 1 ]; then
            echo "DOCKER_NO_CACHE=--no-cache" >> $GITHUB_ENV
            echo "Re-run detected (attempt ${{ github.run_attempt }}): enabling --no-cache"
          else
            echo "DOCKER_NO_CACHE=" >> $GITHUB_ENV
            echo "First attempt: using Docker layer cache"
          fi

      - name: Build & Push Books API
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/books-api:latest"
          IMAGE_LOWER=$(echo $IMAGE | tr '[:upper:]' '[:lower:]')
          docker build $DOCKER_NO_CACHE -t $IMAGE_LOWER ./services/backend/books-api
          docker push $IMAGE_LOWER

      - name: Build & Push Auth Proxy
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/auth-proxy:latest"
          IMAGE_LOWER=$(echo $IMAGE | tr '[:upper:]' '[:lower:]')
          docker build $DOCKER_NO_CACHE -t $IMAGE_LOWER ./services/backend/auth-proxy
          docker push $IMAGE_LOWER

      - name: Build & Push Library Service
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/library-service:latest"
          IMAGE_LOWER=$(echo $IMAGE | tr '[:upper:]' '[:lower:]')
          docker build $DOCKER_NO_CACHE -t $IMAGE_LOWER ./services/backend/library-service
          docker push $IMAGE_LOWER

#DEPLOY FRONTEND
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [frontend, backend, root-tests, supabase-migrate]
    if: |
      always() &&
      needs.frontend.result == 'success' &&
      needs.backend.result == 'success' &&
      needs.root-tests.result == 'success' &&
      (needs.supabase-migrate.result == 'success' || needs.supabase-migrate.result == 'skipped') &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel project settings
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Build with Vercel CLI (prebuilt, D-08)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_BOOKS_API_URL: ${{ secrets.VITE_BOOKS_API_URL }}
          VITE_LIBRARY_API_URL: ${{ secrets.VITE_LIBRARY_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Deploy prebuilt to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

  e2e-playwright:
    runs-on: ubuntu-latest
    needs: [frontend, root-tests]
    if: github.event_name == 'push' && vars.PLAYWRIGHT_RUN == '1'

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke (D-07)
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'http://127.0.0.1:8080' }}
